# Default Unraid deployment: one container.
# This runs Postgres, the Next.js web app, and the background worker inside one
# container to keep the Unraid Docker list compact.
#
# Watchtower checks GHCR every 15 minutes and restarts the container when a
# new image is published. Requires: docker login ghcr.io on the host first.

services:
  review-assistant:
    image: ghcr.io/dylan34612/review-assistant-single:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /mnt/user/appdata/review-assistant/postgres:/var/lib/postgresql/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      AUTH_ENABLED: ${AUTH_ENABLED}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_SECURE: ${IMAP_SECURE}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_MAILBOX: ${IMAP_MAILBOX}
      IMAP_LOOKBACK_DAYS: ${IMAP_LOOKBACK_DAYS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS}

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "900"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
